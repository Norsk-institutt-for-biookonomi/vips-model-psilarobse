name=Gulrotflue observasjonsmodell
description=<p>{{filename="/images/erfl-20240506-152848.jpg" description="Foto: Erling Fl\u00f8istad, NIBIO"}}</p>\n<h3>Modellbeskrivelse</h3>\n<p>Varslingsmodellen er basert p&aring; ukentlige observasjoner av voksne gulrotfluer fanget p&aring; gule limfeller. Modellen er en ren observasjonsbasert modell og det inng&aring;r ingen v&aelig;rdata eller v&aelig;rprognoser. Limfeller plassert i kanten av &aring;keren og inni &aring;keren blir unders&oslash;kt for fangst av gulrotflue ukentlig gjennom sesongen. Antall voksne gulrotfluer registreres i VIPS og benyttes i varslingsmodellen. Observasjonene blir sammenlignet med skadeterskler og varsel blir beregnet. Ved overgang fra bruk av fosformidler, som virket godt mot larver, til pyretroider, som ikke har effekt p&aring; jordlevende larver, i kjemisk bekjempelse av gulrotfluer, ble det i 2005 og 2006 gjennomf&oslash;rt fors&oslash;k for tilpasning av de gamle skadetersklene. B&aring;de norske og utenlandske erfaringer tilsa at f&oslash;rste behandling mot gulrotflue burde utf&oslash;res s&aring; snart som mulig etter observasjon av f&oslash;rste flue. Skadeterskelen som benyttes i VIPS er dermed satt til funn av 1 flue.</p>\n<h3>Tolkning av varsel</h3>\n<p>Gr&oslash;nne bokser betyr at skadeterskelen ikke er n&aring;dd og at det ikke er behov for &aring; sette i verk bekjempelsestiltak.</p>\n<p>Gule bokser betyr at det er funnet gulrotfluer p&aring; feller i kant av &aring;keren og at det kan v&aelig;re behov for &aring; sette i verk bekjempelsestiltak. Sjekk egen &aring;ker og vurder igangsetting av bekjempelsestiltak.</p>\n<p>R&oslash;de bokser betyr at det er funnet gulrotfluer p&aring; feller inni &aring;keren. Sjekk egen &aring;ker og vurder igangsetting av bekjempelsestiltak.</p>\n<p>Skadeterskelen for f&oslash;rste funn p&aring; limfeller er 1 flue. Angrep vil v&aelig;re forskjellig fra felt til felt og derfor anbefaler vi observasjoner i egen &aring;ker i tillegg. Det b&oslash;r iverksettes tiltak s&aring; snart som mulig etter f&oslash;rste funn i egen &aring;ker (forutsatt t&oslash;rre planter, oppholdsv&aelig;r og at gulrotplantene har f&aring;tt sine f&oslash;rste varige blad). Vurder ut fra erfaringer og st&oslash;rrelse og form p&aring; &aring;keren om hele arealet eller bare kantradene skal behandles.</p>\n<h3>Varslingssesong - oppstart og avslutning av varsel</h3>\n<p>Starttidspunkt: Registrering av gulrotfluer p&aring; limfeller i kant og inni &aring;keren starter som regel i mai. Starttidspunkt er avhengig av temperaturforholdene og s&aring;tidspunkt i det enkelte distrikt.</p>\n<p>Sluttidspunkt: Registreringene p&aring;g&aring;r fram til vekstsesongens slutt.</p>\n<h3>Utpr&oslash;ving og validering av modellen</h3>\n<h4>Nasjonalt</h4>\n<p>Skadetersklene som er basis for modellen benyttes i praksis i norsk gulrotdyrking. Ved overgang fra bruk av fosformidler (som virket godt mot larver), til pyretroider (som ikke har effekt p&aring; jordlevende larver) i kjemisk bekjempelse av gulrotfluer, ble det i 2005 og 2006 gjennomf&oslash;rt fors&oslash;k for tilpasning av de gamle skadetersklene. B&aring;de norske og utenlandske erfaringer tilsa at f&oslash;rste behandling mot gulrotflue burde utf&oslash;res s&aring; snart som mulig etter observasjon av f&oslash;rste flue.</p>\n<h4>Internasjonalt</h4>\n<p>Det er en generell oppfatning at med de kjemiske preparater som er tilgjengelig i dag, er det n&oslash;dvendig spr&oslash;yte ved f&oslash;rste funn av gulrotflue p&aring; limfeller. Skadeterskelen er som regel 1 flue/felle/uke eller 0,2 fluer/felle/dag. I mange land benyttes det d&oslash;gngradsmodeller i tillegg til observasjoner av sverming ved hjelp av gule limfeller.</p>\n<h3>Referanser</h3>\n<p>Kontaktpersoner:</p>\n<p>Annette F. Schj&oslash;ll <a href="mailto:annette.folkedal.schjoll@nibio.no">annette.folkedal.schjoll@nibio.no</a><br /> Tor J. Johansen <a href="mailto:tor.johansen@nibio.no">tor.johansen@nibio.no</a></p>\n<p>Les mer i <a href="https://www.plantevernleksikonet.no/l/oppslag/62/" target="_blank">Plantevernleksikonet</a>&nbsp;</p>
statusInterpretation=<p>Skadeterskelen for f&oslash;rste funn p&aring; limfeller er 1 flue. Angrep vil v&aelig;re forskjellig fra felt til felt og derfor anbefaler vi observasjoner i egen &aring;ker i tillegg. Det b&oslash;r iverksettes tiltak s&aring; snart som mulig etter f&oslash;rste funn i egen &aring;ker (forutsatt t&oslash;rre planter, oppholdsv&aelig;r og at gulrotplantene har f&aring;tt sine f&oslash;rste varige blad). Vurder ut fra erfaringer og st&oslash;rrelse og form p&aring; &aring;keren om hele arealet eller bare kantradene skal behandles.</p>\n<h3>Forklaring til grafen</h3>\n<p>Den grafiske presentasjonen viser antall gulrotfluer funnet p&aring; felle plassert i kanten (Fellefangst, kant) av &aring;keren og p&aring; felle plassert inni &aring;keren (Fellefangst, inni) som vertikale stolper i grafen. Skadeterskelen er 1 flue p&aring; fella og vises som en horisontal linje i grafen. N&aring;r den vertikale stolpen for fangst av gulrotflue p&aring; limfelle krysser linjen for skadeterskelen, endres varsel fra gr&oslash;nt til gult dersom funnet er gjort p&aring; felle plassert i kanten av &aring;keren og til r&oslash;dt dersom funnet er gjort p&aring; felle plassert inni &aring;keren.</p>\n<h3>Forklaring til tabellen</h3>\n<p>Gr&oslash;nne bokser betyr at skadeterskelen ikke er n&aring;dd og at det ikke er behov for &aring; sette i verk bekjempelsestiltak.</p>\n<p>Gule bokser betyr at det er funnet gulrotfluer p&aring; feller i kant av &aring;keren og at det kan v&aelig;re behov for &aring; sette i verk bekjempelsestiltak. Sjekk egen &aring;ker og vurder igangsetting av bekjempelsestiltak.</p>\n<p>R&oslash;de bokser betyr at det er funnet gulrotfluer p&aring; feller inni &aring;keren. Sjekk egen &aring;ker og vurder igangsetting av bekjempelsestiltak.</p>
usage=Description of required input parameters:\n\n* timeZone - What timezone the calculation is for. See this list of time zones: http://en.wikipedia.org/wiki/List_of_tz_database_time_zones (Column "TZ")\n* startDateCalculation - when the crop was planted\n* endDateCalculation - when the season is over\n* pestObservations - Array of field observations of the pest, formatted as described in the sample configuration\n\nThe model accepts input data without pestObservations - as an empty array.
